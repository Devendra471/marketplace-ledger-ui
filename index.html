    const podAudit = status==='SETTLED'?'Clean':(status==='UNLOADED' && i%4===0?'Disputed':'Audit Pending');
    const podStatus = status==='CANCELLED'?'NA':(status==='SETTLED'?'Approved':(['UNLOADED'].includes(status)?'Submitted':'Audit Pending'));
    const baseFO = 40000 + ((i*3700) % 90000);
    const baseLSP = baseFO + 15000 + ((i*1100) % 12000);
    const day = String((i % 27) + 1).padStart(2,'0');
    const month = i % 2 === 0 ? '04' : '05';
    const emp = employees[i % employees.length];
    const fc = [{cid:'C1',name:'Loading',amt:1000+(i*100)%1500,status:'Approved',addedBy:emp,at:`2026-${month}-${day} 10:00`,edits:[]}];
    const lc = [{cid:'C1',name:'Loading',amt:1800+(i*120)%1500,status:'Approved',addedBy:emp,at:`2026-${month}-${day} 10:01`,edits:[]}];
    if (['IN-TRANSIT','UNLOADED','SETTLED'].includes(status)) {

    const lc_amt = lc.filter(x=>x.status==='Approved').reduce((s,x)=>s+x.amt,0);
    const balFO = status==='SETTLED'? (baseFO + fc_amt - advFO) : 0;
    const balLSP = status==='SETTLED'? (baseLSP + lc_amt - advLSP) : 0;
    const payments = [], receipts = [];

const INR = n => '₹' + Number(n||0).toLocaleString('en-IN');
const cls = (...a) => a.filter(Boolean).join(' ');

function sumCharges(arr){ return (arr||[]).filter(x=>x.status==='Approved').reduce((s,x)=>s+x.amt,0); }
function sumPending(arr){ return (arr||[]).filter(x=>x.status==='Pending').reduce((s,x)=>s+x.amt,0); }

function commissionFor(freight){
  for (const slab of RULES.commission) if (freight <= slab.upto) return slab.fee;
  return RULES.commission[RULES.commission.length-1].fee;
}
function tdsRateFor(fo){
  if (fo.hasExemption) return RULES.tds.exemption;
  if (!fo.pan) return RULES.tds.panMissing;
  return RULES.tds.panValid;
}

function tripTotals(trip){
  const foCharges = sumCharges(trip.fo.charges);
  const foDed     = sumCharges(trip.fo.deductions);
  const foNet     = trip.fo.freight + foCharges - foDed;
  const foPaid    = (trip.fo.payments||[]).reduce((s,p)=>s+p.amt,0);
  const foDue     = foNet - foPaid;

  const lspCharges= sumCharges(trip.lsp.charges);
  const lspDed    = sumCharges(trip.lsp.deductions);
  const lspNet    = trip.lsp.freight + lspCharges - lspDed;
  const lspRecvd  = (trip.lsp.receipts||[]).reduce((s,p)=>s+p.amt,0);
  const lspDue    = lspNet - lspRecvd;

  const ftCommission = commissionFor(trip.lsp.freight);
  const ftExpMargin  = lspNet - foNet;
  const ftRealMargin = lspRecvd - foPaid;

  return { foCharges, foDed, foNet, foPaid, foDue, lspCharges, lspDed, lspNet, lspRecvd, lspDue, ftCommission, ftExpMargin, ftRealMargin };
}

  Viewer:   { fo:true, lsp:true, ft:false,pod:true, docs:true, audit:true, tracking:true, comments:false,wallet:true },
};

const AppCtx = createContext(null);

function AppProvider({ children }){
  const [trips, setTrips] = useState(TRIPS_SEED);
  const [wallets, setWallets] = useState(WALLETS_SEED);
  const [audit, setAudit] = useState(AUDIT_SEED);
  const [components, setComponents] = useState(COMPONENT_MASTER);
  const [rules, setRules] = useState(RULES);
  const [role, setRole] = useState('Admin');
  const [sectionsByRole, setSectionsByRole] = useState(DEFAULT_SECTIONS);
  const [route, setRoute] = useState({ name:'payments' });
  const [toast, setToast] = useState(null);
  const [asOf, setAsOf] = useState(null); // null means now

  function pushAudit(entry){
    setAudit(a => [{ id: a.length+1, at:new Date().toISOString().slice(0,16).replace('T',' '), ...entry }, ...a]);
  }
  function showToast(msg){ setToast(msg); setTimeout(()=>setToast(null), 2400); }

  return <AppCtx.Provider value={{
    trips, setTrips, wallets, setWallets, audit, pushAudit,
    components, setComponents, rules, setRules,
    role, setRole, sectionsByRole, setSectionsByRole,
    route, setRoute, asOf, setAsOf, toast, showToast,
  }}>{children}</AppCtx.Provider>;
}
const useApp = () => useContext(AppCtx);

function TripDetail({ id }){
  const { trips, setTrips, pushAudit, showToast, components, rules, role, setRoute } = useApp();
  const trip = trips.find(t => t.id === id);
  if (!trip) return <div className="text-slate-500">Trip not found. <button className="text-brand-700" onClick={()=>setRoute({name:'payments'})}>← Back</button></div>;
  const fo = PARTIES.fo.find(p=>p.id===trip.foId);
  const lsp = PARTIES.lsp.find(p=>p.id===trip.lspId);
  const tot = tripTotals(trip);

  function updateTrip(mut){
    setTrips(ts => ts.map(t => t.id===trip.id ? mut({...t}) : t));
  }

  // ---- charge/deduction add ----
  const [addOpen, setAddOpen] = useState(null); // {side, kind}
  const [addForm, setAddForm] = useState({ cid:'', amt:'', remark:'' });

  function openAdd(side, kind){
    setAddForm({ cid:'', amt:'', remark:'' });
    setAddOpen({ side, kind });
  }
  function submitAdd(){
    if (!addForm.cid || !addForm.amt) return;
    const comp = components.find(c=>c.id===addForm.cid);
    if (!comp) return;
    const amt = Number(addForm.amt);
    // approval rule
    let status = 'Approved';
    if (comp.approvalRule === 'always') status = 'Pending';
    else if (comp.approvalRule.startsWith('>')) {
      const thr = Number(comp.approvalRule.slice(1));
      if (amt > thr) status = 'Pending';
    }
    updateTrip(t => {
      const side = addOpen.side; // 'fo' or 'lsp'
      const k = addOpen.kind==='Charge' ? 'charges' : 'deductions';
      t[side] = { ...t[side], [k]: [...(t[side][k]||[]), { cid:comp.id, name:comp.name, amt, status, remark:addForm.remark, addedBy:'you@ft', at: new Date().toISOString().slice(0,16).replace('T',' ') }] };
      return t;
    });
    pushAudit({ actor:'you@ft', trip:trip.id, party: addOpen.side.toUpperCase(), type:'Charge added', action:`${addOpen.kind} added`, details:`${comp.name} ${INR(amt)} (${status})` });
    showToast(`${addOpen.kind} ${status==='Pending'?'added (pending approval)':'added'}`);
    setAddOpen(null);
  }

  function approve(side, kind, idx){
    updateTrip(t => {
      const arr = [...t[side][kind]];
      arr[idx] = { ...arr[idx], status:'Approved' };
      t[side] = { ...t[side], [kind]: arr };
      return t;
    });
    pushAudit({ actor:'finance@ft', trip:trip.id, party:side.toUpperCase(), type:'Edited', action:'Approved', details:`${trip[side][kind][idx].name} ${INR(trip[side][kind][idx].amt)}` });
    showToast('Approved');
  }

  // ---- edit charge/deduction ----
  const [editItem, setEditItem] = useState(null); // { side, kind, idx, newAmt, reason }
  function openEdit(side, kind, idx){
    const item = trip[side][kind][idx];
    setEditItem({ side, kind, idx, currentAmt: item.amt, name: item.name, newAmt: String(item.amt), reason: '' });
  }
  function submitEdit(){
    const { side, kind, idx, currentAmt, newAmt, reason, name } = editItem;
    const next = Number(newAmt);
    if (next === currentAmt) { setEditItem(null); return; }
    updateTrip(t => {
      const arr = [...t[side][kind]];
      const cur = { ...arr[idx] };
      cur.edits = [...(cur.edits||[]), { from:cur.amt, to:next, by:'you@ft', at:new Date().toISOString().slice(0,16).replace('T',' '), reason }];
      cur.amt = next;
      arr[idx] = cur;
      t[side] = { ...t[side], [kind]: arr };
      return t;
    });
    pushAudit({ actor:'you@ft', trip:trip.id, party:side.toUpperCase(), type:'Edited', action:`${kind==='charges'?'Charge':'Deduction'} edited`, details:`${name} ${INR(currentAmt)} → ${INR(next)} ${reason?'('+reason+')':''}` });
    showToast('Updated');
    setEditItem(null);
  }

  // ---- pay/receive ----
  const [payOpen, setPayOpen] = useState(null); // { kind: 'pay'|'recv', stage }
  const [payForm, setPayForm] = useState({ amt:'', mode:'Razorpay', utr:'' });

  function openPay(kind, stage){
    let suggestedAmt = '';
    if (kind === 'pay') {
      if (stage === 'Advance') suggestedAmt = Math.round(trip.fo.freight * 0.8 + sumCharges(trip.fo.charges.filter(c=>['C1','C3'].includes(c.cid))));
      if (stage === 'Balance') suggestedAmt = tot.foDue;
    } else {
      if (stage === 'Advance') suggestedAmt = Math.round(trip.lsp.freight * 0.8 + sumCharges(trip.lsp.charges.filter(c=>['C1','C6','C3'].includes(c.cid))));
      if (stage === 'Balance') suggestedAmt = tot.lspDue;
    }
    setPayForm({ amt: String(suggestedAmt), mode: kind==='pay'?'Razorpay':'NEFT', utr:'' });
    setPayOpen({ kind, stage });
  }
  function submitPay(){
    const amt = Number(payForm.amt);
    if (!amt) return;
    const due = payOpen.kind==='pay' ? tot.foDue : tot.lspDue;
    if (amt > due && !confirm(`Amount ${INR(amt)} exceeds outstanding ${payOpen.kind==='pay'?'payable':'receivable'} of ${INR(due)}. Continue?`)) return;
    const utr = payForm.utr || ('AUTO-'+Math.floor(Math.random()*1e7));
    const at = new Date().toISOString().slice(0,16).replace('T',' ');
    updateTrip(t => {
      if (payOpen.kind === 'pay') t.fo = { ...t.fo, payments: [...t.fo.payments, { stage: payOpen.stage, amt, utr, at, mode: payForm.mode, by:'you@ft' }] };
      else                          t.lsp = { ...t.lsp, receipts: [...t.lsp.receipts, { stage: payOpen.stage, amt, utr, at, mode: payForm.mode, by:'you@ft' }] };
      return t;
    });
    pushAudit({ actor:'you@ft', trip:trip.id, party: payOpen.kind==='pay'?'FO':'LSP', type:'Payment paid', action: payOpen.kind==='pay'?`${payOpen.stage} paid`:`${payOpen.stage} received`, details: `${INR(amt)} via ${payForm.mode} UTR ${utr}` });
    showToast(`${payOpen.stage} ${payOpen.kind==='pay'?'paid':'received'}`);
    setPayOpen(null);
  }

  // ---- comments ----
  const [comments, setComments] = useState([
    { at:'2026-05-09 12:01', by:'priya@ft', text:'Detention discussed with LSP — they confirmed ₹3k/₹4k split.' },
  ]);
  const [newCmt, setNewCmt] = useState('');

  // ---- doc gen ----
  const [docs, setDocs] = useState([
    { name:'Loading Memo', side:'LSP', generatedAt:'2026-05-09 15:00', version:1, tag:'Auto', by:'system' },
  ]);
  function genDoc(name, side, mode='Manual'){
    setDocs(d => {
      const prior = d.filter(x=>x.name===name && x.side===side);
      const nextV = prior.length ? Math.max(...prior.map(x=>x.version))+1 : 1;
      return [...d, { name, side, generatedAt: new Date().toISOString().slice(0,16).replace('T',' '), version: nextV, tag: mode, by: mode==='Auto'?'system':'you@ft' }];
    });
    pushAudit({ actor: mode==='Auto'?'system':'you@ft', trip:trip.id, party:side, type:'Edited', action:`${name} generated`, details: `${mode} • ${side} side` });
    showToast(`${name} v${(docs.filter(x=>x.name===name && x.side===side).length||0)+1} generated`);
  }

  // ---- cancel trip ----
  function cancelTrip(){
    if (!confirm('Cancel this trip? Freight will be zeroed; existing payments move to wallet.')) return;
    updateTrip(t => {
      t.status = 'CANCELLED';
      t.fo = { ...t.fo, freight:0, charges:[], deductions:[] };
      t.lsp = { ...t.lsp, freight:0, charges:[], deductions:[] };
      return t;
    });
    pushAudit({ actor:'you@ft', trip:trip.id, action:'Trip cancelled', details:`Freight zeroed; payments moved to wallets (mock)` });
    showToast('Trip cancelled and payments moved to wallets');
  }

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <div>
          <button onClick={()=>setRoute({name:'payments'})} className="text-sm text-brand-700 hover:underline">← Payments</button>
          <div className="flex items-center gap-3 mt-1">
            <h1 className="text-xl font-semibold text-slate-900">{trip.id}</h1>
            <StatusChip status={trip.status}/>
            <span className="text-slate-500 text-sm">{trip.route} • {trip.vehicle} • LR {trip.lr}</span>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <Select value={trip.status} onChange={e=>{const ns=e.target.value;updateTrip(t=>({...t,status:ns}));pushAudit({actor:'you@ft',trip:trip.id,action:'Status changed',details:`${trip.status} → ${ns}`,party:'',type:'Status'});showToast(`Status → ${ns}`);}}>
            {['LOADED','DISPATCHED','IN-TRANSIT','UNLOADED','SETTLED','CANCELLED'].map(s=><option key={s}>{s}</option>)}
          </Select>
          <Button kind="danger" onClick={cancelTrip}>Cancel Trip</Button>
        </div>
      </div>

      {/* Summary strip */}
      <div className="grid grid-cols-4 gap-3">
        <SummaryCard label="Net Payable (FO)" value={INR(tot.foNet)} sub={`Due ${INR(tot.foDue)}`} tone="rose"/>
        <SummaryCard label="Net Receivable (LSP)" value={INR(tot.lspNet)} sub={`Due ${INR(tot.lspDue)}`} tone="emerald"/>
        <SummaryCard label="FT Expected Margin" value={INR(tot.ftExpMargin)} sub={`Realized ${INR(tot.ftRealMargin)}`} tone="brand"/>
        <SummaryCard label="Dala Charges" value={INR(tot.ftCommission)} sub={`Auto from slabs`} tone="slate"/>
      </div>

      {/* Tracking */}
      <Section id="tracking" title="Trip Tracking" defaultOpen={false} right={<Button size="sm" kind="ghost" onClick={()=>showToast('Refreshed')}>↻ Refresh</Button>}>
        <div className="grid grid-cols-4 gap-3 text-sm">
          <Field label="Started" value={trip.startedAt}/>
          <Field label="Unloaded" value={trip.unloadedAt||'—'}/>
          <Field label="POD" value={<StatusChip status={trip.podStatus}/>}/>
          <Field label="Current Status" value={<StatusChip status={trip.status}/>}/>
        </div>
        <Timeline trip={trip}/>
        <div className="font-semibold text-sm text-slate-700 mt-5 mb-2">Trip Documents</div>
        <TripDocs trip={trip} updateTrip={updateTrip} pushAudit={pushAudit} showToast={showToast}/>
      </Section>

      {/* FO Section */}
      <Section id="fo" title={`Fleet Owner — ${fo?.name}`} right={<div className="flex gap-2"><Button size="sm" kind="soft" onClick={()=>openAdd('fo','Charge')}>+ Charge</Button><Button size="sm" kind="outline" onClick={()=>openAdd('fo','Deduction')}>+ Deduction</Button></div>}>
        <PartySectionTable side="fo" trip={trip} totals={tot} fo={fo} onApprove={approve} onPay={(stage)=>openPay('pay',stage)} onEdit={openEdit}/>
      </Section>

      {/* LSP Section */}
      <Section id="lsp" title={`LSP — ${lsp?.name} (${trip.lspBranch})`} right={<div className="flex gap-2"><Button size="sm" kind="soft" onClick={()=>openAdd('lsp','Charge')}>+ Charge</Button><Button size="sm" kind="outline" onClick={()=>openAdd('lsp','Deduction')}>+ Deduction</Button></div>}>
        <PartySectionTable side="lsp" trip={trip} totals={tot} fo={fo} onApprove={approve} onPay={(stage)=>openPay('recv',stage)} onEdit={openEdit}/>
      </Section>

      {/* FT Section */}
      <Section id="ft" title="Freight Tiger — Earnings & Margin" defaultOpen={false}>
        <div className="grid grid-cols-3 gap-3 text-sm">
          <Field label="Dala Charges (Auto)" value={INR(tot.ftCommission)}/>
          <Field label="Expected Margin" value={INR(tot.ftExpMargin)}/>
          <Field label="Realized Margin" value={INR(tot.ftRealMargin)}/>
        </div>
        <div className="text-xs text-slate-500 mt-2">Dala Charges (commission) derived from rules engine slabs based on LSP freight {INR(trip.lsp.freight)}.</div>
      </Section>

      {/* POD */}
      <Section id="pod" title="POD Details">
        <PODSection trip={trip} updateTrip={updateTrip} pushAudit={pushAudit} showToast={showToast}/>
      </Section>

      {/* Documents */}
      <Section id="docs" title="Documents" right={
        <div className="flex gap-2">
          <Button size="sm" kind="ghost" onClick={()=>genDoc('Loading Memo','LSP')}>Generate Loading Memo</Button>
          <Button size="sm" kind="ghost" onClick={()=>genDoc('Bill of Supply','LSP')}>Generate BoS</Button>
          <Button size="sm" kind="ghost" onClick={()=>genDoc('Credit Note','FO')}>Generate CN</Button>
        </div>
      }>
        <table className="min-w-full text-sm">
          <thead className="text-slate-500 text-xs"><tr className="text-left">
            <th className="py-2">Document</th><th>Side</th><th>Version</th><th>Tag</th><th>Generated</th><th>By</th><th></th>
          </tr></thead>
          <tbody>
            {docs.map((d,i)=>(
              <tr key={i} className="border-t border-slate-100">
                <td className="py-2 font-medium">{d.name}</td>
                <td>{d.side}</td>
                <td className="font-mono text-xs">v{d.version}</td>
                <td><StatusChip status={d.tag}/></td>
                <td className="text-slate-500">{d.generatedAt}</td>
                <td className="text-xs text-slate-500">{d.by}</td>
                <td className="text-right"><Button kind="ghost" size="sm" onClick={()=>showToast('Download started (mock)')}>Download</Button></td>
              </tr>
            ))}
            {docs.length===0 && <tr><td colSpan={7}><Empty msg="No documents yet"/></td></tr>}
          </tbody>
        </table>
      </Section>

      {/* Comments */}
      <Section id="comments" title="Comments & Notes" defaultOpen={false}>
        <div className="space-y-2">
          {comments.map((c,i)=>(
            <div key={i} className="text-sm bg-slate-50 rounded-lg p-3">
              <div className="text-slate-700">{c.text}</div>
              <div className="text-[11px] text-slate-400 mt-1">{c.by} • {c.at}</div>
            </div>
          ))}
          <div className="flex gap-2">
            <input className="flex-1 px-3 py-2 text-sm rounded-lg border border-slate-300" placeholder="Add a comment..." value={newCmt} onChange={e=>setNewCmt(e.target.value)} />
            <Button onClick={()=>{ if(!newCmt) return; setComments(cs=>[...cs,{at:new Date().toISOString().slice(0,16).replace('T',' '),by:'you@ft',text:newCmt}]); setNewCmt(''); }}>Post</Button>
          </div>
        </div>
      </Section>

      {/* Audit */}
      <Section id="audit" title="Audit Log" defaultOpen={false}>
        <TripAudit tripId={trip.id}/>
      </Section>

      {/* Add modal */}
      <Modal open={!!addOpen} onClose={()=>setAddOpen(null)} title={addOpen?`Add ${addOpen.kind} • ${addOpen.side.toUpperCase()}`:''} footer={
        <>
          <Button kind="outline" onClick={()=>setAddOpen(null)}>Cancel</Button>
          <Button onClick={submitAdd}>Save</Button>
        </>
      }>
        <div className="space-y-3">
          <Select label="Component" value={addForm.cid} onChange={e=>setAddForm({...addForm,cid:e.target.value})}>
            <option value="">Select…</option>
            {components.filter(c=>c.kind===addOpen?.kind && (c.side==='Both'|| (addOpen?.side==='fo' && c.side==='Payable') || (addOpen?.side==='lsp' && c.side==='Receivable'))).map(c=>(
              <option key={c.id} value={c.id}>{c.name} {c.isAuto?'(Auto)':''}</option>
            ))}
          </Select>
          <Input label="Amount (₹)" type="number" value={addForm.amt} onChange={e=>setAddForm({...addForm,amt:e.target.value})}/>
          <Input label="Remark" value={addForm.remark} onChange={e=>setAddForm({...addForm,remark:e.target.value})} placeholder="Optional"/>
          {addForm.cid && (() => {
            const c = components.find(x=>x.id===addForm.cid);
            if (!c) return null;
            const amt = Number(addForm.amt||0);
            let status = 'Approved';
            if (c.approvalRule === 'always') status = 'Pending';
            else if (c.approvalRule.startsWith('>') && amt > Number(c.approvalRule.slice(1))) status = 'Pending';
            return (
              <div className="text-xs bg-slate-50 p-3 rounded-lg">
                Approval rule: <span className="font-mono">{c.approvalRule}</span> → on save it will be <span className="font-semibold">{status}</span>.<br/>
                Limits: max abs {INR(c.maxAbs)}, max {c.maxPct}% of freight.
              </div>
            );
          })()}
        </div>
      </Modal>

      {/* Edit charge/deduction modal */}
      <Modal open={!!editItem} onClose={()=>setEditItem(null)} title={editItem?`Edit ${editItem.name}`:''} footer={
        <>
          <Button kind="outline" onClick={()=>setEditItem(null)}>Cancel</Button>
          <Button onClick={submitEdit}>Save</Button>
        </>
      }>
        {editItem && (
          <div className="space-y-3">
            <div className="text-xs text-slate-500">Current value: <span className="font-semibold text-slate-700">{INR(editItem.currentAmt)}</span></div>
            <Input label="New Amount (₹)" type="number" value={editItem.newAmt} onChange={e=>setEditItem({...editItem,newAmt:e.target.value})}/>
            <Input label="Reason for change" value={editItem.reason} onChange={e=>setEditItem({...editItem,reason:e.target.value})} placeholder="e.g. Confirmed with FO"/>
            <div className="text-xs text-amber-700 bg-amber-50 p-2 rounded-lg">A new ledger event will be created (append-only). The old value remains in the history.</div>
          </div>
        )}
      </Modal>

      {/* Pay modal */}
      <Modal open={!!payOpen} onClose={()=>setPayOpen(null)} title={payOpen?(payOpen.kind==='pay'?`Pay ${payOpen.stage} to ${fo?.name}`:`Receive ${payOpen.stage} from ${lsp?.name}`):''} footer={
        <>
          <Button kind="outline" onClick={()=>setPayOpen(null)}>Cancel</Button>
          <Button onClick={submitPay}>{payOpen?.kind==='pay'?'Pay Now':'Record Receipt'}</Button>
        </>
      }>
        <div className="space-y-3">
          <Input label="Amount (₹)" type="number" value={payForm.amt} onChange={e=>setPayForm({...payForm,amt:e.target.value})}/>
          <Select label="Mode" value={payForm.mode} onChange={e=>setPayForm({...payForm,mode:e.target.value})}>
            {(payOpen?.kind==='pay'?['Razorpay','NEFT','Cash','Cheque']:['NEFT','RTGS','UPI','Cheque','Cash']).map(m=><option key={m}>{m}</option>)}
          </Select>
          <Input label="UTR / Reference" value={payForm.utr} onChange={e=>setPayForm({...payForm,utr:e.target.value})} placeholder="Leave blank to auto-generate"/>
          <div className="text-xs bg-amber-50 text-amber-800 p-3 rounded-lg">
            Gating checks: {payOpen?.stage==='Balance' && trip.podStatus!=='Approved' ? <span className="text-rose-700">POD not approved — balance payment normally blocked (allowed in prototype)</span> : 'Pass'}
          </div>
        </div>
      </Modal>
    </div>
  );
}

function SummaryCard({ label, value, sub, tone='brand' }){
  const tones = {
    brand:'border-brand-100 bg-brand-50/30',
    emerald:'border-emerald-100 bg-emerald-50/30',
    rose:'border-rose-100 bg-rose-50/30',
    slate:'border-slate-200 bg-slate-50/30',
  };
  return (
    <div className={cls('rounded-2xl border p-4', tones[tone])}>
      <div className="text-xs text-slate-500 font-medium">{label}</div>
      <div className="text-2xl font-semibold text-slate-900 mt-1 tabular-nums">{value}</div>
      <div className="text-[11px] text-slate-500 mt-1">{sub}</div>
    </div>
  );
}

const Field = ({ label, value }) => (
  <div><div className="text-[11px] text-slate-500 font-medium uppercase tracking-wide">{label}</div><div className="text-sm text-slate-800 mt-1">{value}</div></div>
);

function Timeline({ trip }){
  const points = [
    { label:'Created', at:trip.startedAt, done:true },
    { label:'Loaded', at:trip.startedAt, done:true },
    { label:'In Transit', at:trip.startedAt, done:trip.status!=='LOADED' },
    { label:'Unloaded', at:trip.unloadedAt, done:!!trip.unloadedAt },
    { label:'POD', at:trip.unloadedAt, done:trip.podStatus==='Approved' },
    { label:'Settled', at:null, done:trip.status==='SETTLED' },
  ];
  return (
    <div className="flex items-center gap-1 mt-4 overflow-x-auto pb-1">
      {points.map((p,i)=>(
        <Fragment key={i}>
          <div className="text-center min-w-[90px]">
            <div className={cls('w-3 h-3 mx-auto rounded-full', p.done?'bg-emerald-500':'bg-slate-300')}/>
            <div className="text-[11px] mt-1 font-medium text-slate-700">{p.label}</div>
            <div className="text-[10px] text-slate-400">{p.at||'—'}</div>
          </div>
          {i<points.length-1 && <div className={cls('h-px flex-1', points[i+1].done?'bg-emerald-300':'bg-slate-200')}/>}
        </Fragment>
      ))}
    </div>
  );
}

function PartySectionTable({ side, trip, totals, fo, onApprove, onPay, onEdit }){
  const data = trip[side];
  const isFO = side === 'fo';
  const payments = isFO ? data.payments : data.receipts;
  const labels = isFO ? {pay:'Paid', net:'Net Payable', due:'Balance Payable'} : {pay:'Received', net:'Net Receivable', due:'Balance Receivable'};
  const charges = isFO ? totals.foCharges : totals.lspCharges;
  const ded = isFO ? totals.foDed : totals.lspDed;
  const net = isFO ? totals.foNet : totals.lspNet;
  const due = isFO ? totals.foDue : totals.lspDue;

  const advancePaid = (payments||[]).some(p=>p.stage==='Advance');
  const balancePaid = (payments||[]).some(p=>p.stage==='Balance');
  const advanceAllowed = ['DISPATCHED','IN-TRANSIT','UNLOADED','SETTLED'].includes(trip.status);
  const balanceAllowed = ['UNLOADED','SETTLED'].includes(trip.status);

  const advanceDisabled = advancePaid || !advanceAllowed;
  const balanceDisabled = balancePaid || !balanceAllowed;

  return (
    <div>
      <div className="grid grid-cols-5 gap-3 mb-4">
        <MiniStat label="Base Freight" value={INR(data.freight)}/>
        <MiniStat label="Charges (approved)" value={INR(charges)}/>
        <MiniStat label="Deductions (approved)" value={INR(ded)}/>
        <MiniStat label={labels.net} value={INR(net)}/>
        <MiniStat label={labels.due} value={INR(due)} tone={due>0?'rose':'emerald'}/>
      </div>

      {/* Charges */}
      <div className="font-semibold text-sm text-slate-700 mb-2">Charges</div>
      <ItemTable items={data.charges} side={side} kind="charges" onApprove={onApprove} onEdit={onEdit}/>
      <div className="font-semibold text-sm text-slate-700 mt-4 mb-2">Deductions</div>
      <ItemTable items={data.deductions} side={side} kind="deductions" onApprove={onApprove} onEdit={onEdit}/>

      {/* Payments */}
      <div className="flex items-center justify-between mt-5 mb-2">
        <div className="font-semibold text-sm text-slate-700">{isFO?'Payments':'Receipts'}</div>
        <div className="flex gap-2">
          <Button size="sm" kind="soft" disabled={advanceDisabled} className={advanceDisabled?'opacity-50 cursor-not-allowed':''} onClick={()=>!advanceDisabled && onPay('Advance')} title={advancePaid?'Advance already paid':(!advanceAllowed?'Trip must be Dispatched or In-Transit':'')}>+ Advance{advancePaid&&' ✓'}</Button>
          <Button size="sm" kind="soft" onClick={()=>onPay('Interim')}>+ Interim</Button>
          <Button size="sm" kind="primary" disabled={balanceDisabled} className={balanceDisabled?'opacity-50 cursor-not-allowed':''} onClick={()=>!balanceDisabled && onPay('Balance')} title={balancePaid?'Balance already paid':(!balanceAllowed?'Vehicle must be Unloaded':'')}>+ Balance{balancePaid&&' ✓'}</Button>
        </div>
      </div>
      <table className="min-w-full text-sm">
        <thead className="text-slate-500 text-xs"><tr className="text-left">
          <th className="py-2">Stage</th><th>Amount</th><th>Mode</th><th>Reference</th><th>At</th>
        </tr></thead>
        <tbody>
          {(payments||[]).map((p,i)=>(
            <tr key={i} className="border-t border-slate-100">
              <td className="py-2 font-medium">{p.stage}</td>
              <td className="tabular-nums">{INR(p.amt)}</td>
              <td>{p.mode||'NEFT'}</td>
              <td className="font-mono text-xs">{p.utr}</td>
              <td className="text-slate-500">{p.at}</td>
            </tr>
          ))}
          {(payments||[]).length===0 && <tr><td colSpan={5}><Empty msg="No payments yet"/></td></tr>}
        </tbody>
      </table>
    </div>
  );
}

function ItemTable({ items, side, kind, onApprove, onEdit }){
  const [hist, setHist] = useState(null); // index whose history popover is open
  if (!items?.length) return <Empty msg="None yet"/>;
  return (
    <table className="min-w-full text-sm">
      <thead className="text-slate-500 text-xs"><tr className="text-left">
        <th className="py-2">Component</th><th>Amount</th><th>Status</th><th>Added by</th><th>Remark</th><th className="text-right">Actions</th>
      </tr></thead>
      <tbody>
        {items.map((c,i)=>(
          <tr key={i} className="border-t border-slate-100 align-top">
            <td className="py-2 font-medium">
              <div className="flex items-center gap-1">
                {c.name}
                {(c.edits?.length>0) && (
                  <button className="relative text-[11px] text-amber-700 hover:text-amber-900" title={`${c.edits.length} edit${c.edits.length>1?'s':''}`} onClick={()=>setHist(hist===i?null:i)}>
                    🕘
                    {hist===i && (
                      <div className="absolute z-30 left-0 mt-1 w-80 bg-white border border-slate-200 rounded-xl shadow-xl p-3 text-left">
                        <div className="text-xs font-semibold text-slate-700 mb-2">Edit history</div>
                        {c.edits.map((e,k)=>(
                          <div key={k} className="text-xs text-slate-600 border-t border-slate-100 pt-2 mt-2 first:border-0 first:pt-0 first:mt-0">
                            <div><span className="font-mono">{INR(e.from)}</span> → <span className="font-mono font-semibold">{INR(e.to)}</span></div>
                            <div className="text-[11px] text-slate-500">{e.by} • {e.at}</div>
                            {e.reason && <div className="text-[11px] italic text-slate-500">"{e.reason}"</div>}
                          </div>
                        ))}
                      </div>
                    )}
                  </button>
                )}
              </div>
            </td>
            <td className="tabular-nums">{INR(c.amt)}</td>
            <td><StatusChip status={c.status}/></td>
            <td className="text-xs">
              <div className="text-slate-700">{c.addedBy||'—'}</div>
              <div className="text-[10px] text-slate-400">{c.at}</div>
            </td>
            <td className="text-xs text-slate-500">{c.remark||'—'}</td>
            <td className="text-right whitespace-nowrap">
              {c.status==='Pending' && <Button size="sm" kind="success" onClick={()=>onApprove(side,kind,i)}>Approve</Button>}
              {' '}
              <Button size="sm" kind="ghost" onClick={()=>onEdit && onEdit(side,kind,i)} title="Edit (append-only)">✎ Edit</Button>
            </td>
          </tr>
        ))}
      </tbody>
    </table>
  );
}

function MiniStat({ label, value, tone }){
  const tones = { rose:'text-rose-700', emerald:'text-emerald-700' };
  return (
    <div className="rounded-lg border border-slate-200 p-3">
      <div className="text-[11px] text-slate-500 uppercase font-medium tracking-wide">{label}</div>
      <div className={cls('text-base font-semibold mt-1 tabular-nums', tones[tone]||'text-slate-900')}>{value}</div>
    </div>
  );
}

function TripAudit({ tripId }){
  const { audit } = useApp();
  const [party, setParty] = useState('');
  const [type, setType]   = useState('');
  const rows = audit.filter(a => a.trip===tripId && (!party || a.party===party) && (!type || a.type===type));
  const types = ['Charge added','Edited','Payment paid','Status'];
  return (
    <div>
      <div className="flex flex-wrap items-end gap-3 mb-3 p-3 bg-slate-50 rounded-lg">
        <Select label="Party" value={party} onChange={e=>setParty(e.target.value)}>
          <option value="">All</option>
          <option value="FO">FO</option>
          <option value="LSP">LSP</option>
        </Select>
        <Select label="Action" value={type} onChange={e=>setType(e.target.value)}>
          <option value="">All</option>
          {types.map(t=><option key={t}>{t}</option>)}
        </Select>
        {(party||type) && <Button kind="ghost" size="sm" onClick={()=>{setParty('');setType('');}}>Clear filters</Button>}
        <div className="ml-auto text-xs text-slate-500">{rows.length} entries</div>
      </div>
      <table className="min-w-full text-sm">
        <thead className="text-slate-500 text-xs"><tr className="text-left">
          <th className="py-2">At</th><th>Actor</th><th>Party</th><th>Action</th><th>Details</th>
        </tr></thead>
        <tbody>
          {rows.map(r=>(
            <tr key={r.id} className="border-t border-slate-100">
              <td className="py-2 text-slate-500 whitespace-nowrap">{r.at}</td>
              <td className="text-xs">{r.actor}</td>

            </tr>
          ))}
          {rows.length===0 && <tr><td colSpan={5}><Empty msg="No audit entries match"/></td></tr>}
        </tbody>
      </table>
    </div>
  );
}

function TripDocs({ trip, updateTrip, pushAudit, showToast }){
  const types = [
    { key:'lr', label:'LR (Lorry Receipt)' },
    { key:'invoice', label:'Invoice' },
    { key:'rc', label:'RC (Registration Certificate)' },
  ];
  function upload(key){
    const file = prompt(`Filename for ${key.toUpperCase()}?`, `${key.toUpperCase()}-${trip.id}.pdf`);
    if (!file) return;
    updateTrip(t => ({ ...t, docs: { ...(t.docs||{}), [key]: { file, uploadedBy:'you@ft', at:new Date().toISOString().slice(0,16).replace('T',' '), approved:true }}}));
    pushAudit({ actor:'you@ft', trip:trip.id, party:'', type:'Edited', action:`${key.toUpperCase()} uploaded`, details:file });
    showToast(`${key.toUpperCase()} uploaded`);
  }
  function approve(key){
    updateTrip(t => ({ ...t, docs: { ...(t.docs||{}), [key]: { ...(t.docs?.[key]||{}), approved:true }}}));
    pushAudit({ actor:'you@ft', trip:trip.id, party:'', type:'Edited', action:`${key.toUpperCase()} approved`, details:trip.docs?.[key]?.file||'' });
    showToast(`${key.toUpperCase()} approved`);
  }
  return (
    <div className="grid grid-cols-3 gap-3">
      {types.map(t => {
        const d = trip.docs?.[t.key];
        return (
          <div key={t.key} className="border border-slate-200 rounded-xl p-3">
            <div className="text-sm font-semibold text-slate-800 mb-2">{t.label}</div>
            {d ? (
              <>
                <div className="text-xs text-slate-600 font-mono">{d.file}</div>
                <div className="text-[11px] text-slate-500">Uploaded by {d.uploadedBy} • {d.at}</div>
                <div className="mt-2 flex items-center gap-2">
                  {d.approved ? <StatusChip status="Approved"/> : <StatusChip status="Pending"/>}
                  <div className="ml-auto flex gap-1">
                    <Button kind="ghost" size="sm" onClick={()=>showToast('Preview (mock)')}>View</Button>
                    {!d.approved && <Button kind="success" size="sm" onClick={()=>approve(t.key)}>Approve</Button>}
                    <Button kind="ghost" size="sm" onClick={()=>upload(t.key)}>Replace</Button>
                  </div>
                </div>
              </>
            ) : (
              <div>
                <div className="text-xs text-slate-400 italic">Not uploaded</div>
                <Button kind="outline" size="sm" className="mt-2" onClick={()=>upload(t.key)}>⬆ Upload</Button>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

          </div>

        <div>
          <label className="flex items-center gap-2 text-sm"><input type="checkbox"/> Hard Copy of POD Received</label>
          <Input label="Received Date" type="date" className="mt-2"/>
        </div>
        <div>
          <label className="flex items-center gap-2 text-sm"><input type="checkbox"/> Hard Copy of POD shared with LSP</label>
          <div className="grid grid-cols-2 gap-2 mt-2">
            <Input label="Dispatched Date" type="date"/>
            <Input label="Tracking Number" placeholder="Tracking Number"/>
          </div>
        </div>
      </div>

      <div>
        <div className="text-xs font-semibold text-slate-500 uppercase mb-2">POD Audit</div>
        <div className="flex flex-col gap-2">
          {['Audit Pending','Clean','Disputed'].map(opt => (
            <label key={opt} className="flex items-center gap-2 text-sm">
              <input type="radio" name="podAudit" checked={trip.podAudit===opt} onChange={()=>{set('podAudit',opt);pushAudit({actor:'you@ft',trip:trip.id,party:'',type:'Edited',action:'POD audit changed',details:opt});}}/>
              {opt} POD
            </label>
          ))}
          {isDisputed && (
            <div className="ml-6 flex flex-wrap gap-4 mt-1">
              {['Shortages','Damages','Okay Seal is Unbroken','Wrong Product','Brand Mismatch'].map(r => (
                <label key={r} className="flex items-center gap-2 text-sm">
                  <input type="checkbox" checked={(trip.podDisputeReasons||[]).includes(r)} onChange={()=>toggleReason(r)}/>

          )}
        </div>
      </div>

      <div>
        <div className="text-xs font-semibold text-slate-500 uppercase mb-2">Remark / Comment on POD</div>

                  : trip.podAvailability==='POD Submitted Onsite' ? 'Submitted' : 'Audit Pending';
          set('podStatus', s);

  );

function PartyLedger({ kind, id }){
  // kind: 'fo' | 'lsp'
  const { trips, wallets, setRoute } = useApp();
  const list = kind==='fo' ? PARTIES.fo : PARTIES.lsp;
  const party = list.find(p=>p.id===id);
  if (!party) return <div>Party not found.</div>;
  const w = wallets[id] || { ftOwes:0, partyOwes:0, events:[] };

  const [filter, setFilter] = useState('all'); // 'all'|'settled'|'audited-pending'|'unaudited-pending'|'owes-ft'|'ft-owes'

  const partyTrips = trips.filter(t => kind==='fo' ? t.foId===id : t.lspId===id);

  // ----- per-trip classification helpers -----
  function classify(t){
    const tot = tripTotals(t);
    const net = kind==='fo' ? tot.foNet : tot.lspNet;
    const paid = kind==='fo' ? tot.foPaid : tot.lspRecvd;
    const due = kind==='fo' ? tot.foDue : tot.lspDue;
    const podApproved = t.podStatus==='Approved';
    const isSettled = t.status==='SETTLED' && due<=0 && podApproved;
    const isOverpaid = paid > net && t.status!=='CANCELLED'; // overpayment
    const isCancelledWithPayment = t.status==='CANCELLED' && paid > 0; // recovery scenario
    return {
      tot, net, paid, due, podApproved, isSettled, isOverpaid, isCancelledWithPayment,
      auditedPending: podApproved && due > 0 && t.status!=='CANCELLED',
      unauditedPending: !podApproved && due > 0 && t.status!=='CANCELLED',
      partyOwesFT: isOverpaid || isCancelledWithPayment,
    };
  }

  let totalNet = 0, totalSettledAmt = 0;
  let settledCount = 0, auditedPendingAmt = 0, auditedPendingCount = 0;
  let unauditedPendingAmt = 0, unauditedPendingCount = 0;
  let owesFTAmt = 0, owesFTCount = 0;
  let ftOwesAmt = 0, ftOwesCount = 0;
  partyTrips.forEach(t => {
    const c = classify(t);
    totalNet += c.net;
    if (c.isSettled) { totalSettledAmt += c.net; settledCount++; }
    if (c.auditedPending)   { auditedPendingAmt   += c.due; auditedPendingCount++; }
    if (c.unauditedPending) { unauditedPendingAmt += c.due; unauditedPendingCount++; }
    if (c.partyOwesFT) {
      const over = Math.max(0, c.paid - c.net);
      owesFTAmt += over;
      owesFTCount++;
    }
  });
  // For LSP only: FT-owes-LSP can exist (LSP overpaid us)
  if (kind==='lsp') { ftOwesAmt = w.ftOwes||0; ftOwesCount = (w.events||[]).filter(e=>!/Recovery|Shortfall|Loan|Penalty/.test(e.type)).length; }

  // ----- filter trips for the table -----
  function matchesFilter(t){
    const c = classify(t);
    switch(filter){
      case 'settled': return c.isSettled;
      case 'audited-pending': return c.auditedPending;
      case 'unaudited-pending': return c.unauditedPending;
      case 'owes-ft': return c.partyOwesFT;
      case 'ft-owes': return kind==='lsp' && c.paid > c.net; // mock heuristic
      default: return true;
    }
  }
  const visibleTrips = partyTrips.filter(matchesFilter);

  const FILTER_LABELS = {
    all:'All trips',
    settled:'Settled',
    'audited-pending':'Audited & Payment Pending',
    'unaudited-pending':'Awaiting POD / Audit',
    'owes-ft': kind==='fo'?'FO Owes FT (Overpaid / Cancelled)':'LSP Owes FT (Shortfall / Cancelled)',
    'ft-owes':'FT Owes LSP (Overpaid by LSP)',
  };

  return (
    <div className="space-y-4">
      <div>
        <button onClick={()=>setRoute({name:kind==='fo'?'fo':'lsp'})} className="text-sm text-brand-700 hover:underline">← {kind==='fo'?'Fleet Owners':'LSPs'}</button>
        <div className="flex items-center justify-between mt-1">
          <h1 className="text-xl font-semibold">{party.name} <span className="text-slate-400 text-base font-normal">• {party.id}</span></h1>
          <div className="flex gap-2"><Button kind="outline">Download Statement</Button><Button>Record Payment</Button></div>
        </div>
        <div className="text-sm text-slate-500 mt-1">PAN {party.pan} {party.gst&&`• GST ${party.gst}`}{kind==='fo'&&` • TDS ${party.hasExemption?'Exempt':party.tdsRate+'%'}`}{kind==='lsp'&&` • Credit ${party.creditDays}d`}</div>
      </div>

      {/* ── Headline row: 3 KPIs ── */}
      <div className="grid grid-cols-3 gap-3">
        <ClickableStat
          active={filter==='all'} onClick={()=>setFilter('all')}
          label={kind==='fo'?'Total Payable':'Total Receivable'}
          value={INR(totalNet)}
          sub={`${partyTrips.length} trips • click to view all`}
          tone="brand"
        />
        <ClickableStat
          active={filter==='settled'} onClick={()=>setFilter('settled')}
          label="Settled" value={INR(totalSettledAmt)}
          sub={`${settledCount} trip${settledCount===1?'':'s'} • POD approved + balance paid`}
          tone="emerald"
        />
        <ClickableStat
          active={filter==='owes-ft'} onClick={()=>setFilter('owes-ft')}
          label={kind==='fo'?'FO Owes FT':'LSP Owes FT'}
          value={INR(owesFTAmt + (w.partyOwes||0))}
          sub={kind==='fo'?'Overpayment / cancelled advance — recover from next trip':'Shortfall / cancelled receipt'}
          tone="rose"
        />
      </div>

      {/* ── Action buckets: who is blocking ── */}
      <div className="grid grid-cols-2 gap-3">
        <ClickableStat
          active={filter==='unaudited-pending'} onClick={()=>setFilter('unaudited-pending')}
          icon="⏳" label="Awaiting POD / Audit"
          value={INR(unauditedPendingAmt)}
          sub={`${unauditedPendingCount} trips • Ops + POD Audit own next step`}
          tone="amber"
        />
        <ClickableStat
          active={filter==='audited-pending'} onClick={()=>setFilter('audited-pending')}
          icon="💰" label="Audited & Payment Pending"
          value={INR(auditedPendingAmt)}
          sub={`${auditedPendingCount} trips • POD approved, Finance to release ${kind==='fo'?'balance payout':'collection'}`}
          tone="indigo"
        />
      </div>

      {/* ── Wallet ── only FO Owes FT for FOs; both directions for LSPs ── */}
      <Card title={kind==='fo'?'Wallet — Recoverable from future payouts':'Wallet — Credits & Recoveries'}
        right={kind==='fo'
          ? <div className="text-xs text-slate-500">Recoverable: <span className="font-semibold text-rose-700">{INR(w.partyOwes||0)}</span></div>
          : <div className="text-xs text-slate-500">Net exposure: <span className="font-semibold text-slate-800">{INR((w.ftOwes||0)-(w.partyOwes||0))}</span></div>
        }>
        {kind==='fo' && (
          <div className="text-xs text-slate-500 mb-3 bg-amber-50 border border-amber-100 rounded-lg p-3">
            FO doesn't pay FT directly. Any "FO Owes FT" amount is auto-netted from this FO's next trip payout (advance or balance).
          </div>
        )}
        <table className="min-w-full text-sm">
          <thead className="text-slate-500 text-xs"><tr className="text-left">
            <th className="py-2">At</th><th>Type</th><th>Direction</th><th className="text-right">Amount</th><th>Source Trip</th><th>Note</th>
          </tr></thead>
          <tbody>
            {(w.events||[]).filter(e => kind==='fo' ? /Recovery|Shortfall|Loan|Penalty|Cancelled/.test(e.type) : true).map((e,i)=>{
              const isPartyOwes = /Recovery|Shortfall|Loan|Penalty|Cancelled receipt/.test(e.type) || (kind==='fo' && /Cancelled/.test(e.type));
              return (
                <tr key={i} className="border-t border-slate-100">
                  <td className="py-2 text-slate-500">{e.at}</td>
                  <td className="font-medium">{e.type}</td>
                  <td>
                    {kind==='fo'
                      ? <span className="chip bg-rose-100 text-rose-700">FO owes FT</span>
                      : <span className={cls('chip', isPartyOwes?'bg-rose-100 text-rose-700':'bg-emerald-100 text-emerald-700')}>{isPartyOwes?'LSP owes FT':'FT owes LSP'}</span>
                    }
                  </td>
                  <td className="text-right tabular-nums">{INR(e.amt)}</td>
                  <td className="text-xs"><button className="text-brand-700 hover:underline" onClick={()=>{const m=e.ref.match(/T-\d+/); if(m) setRoute({name:'trip',id:m[0]});}}>{e.ref}</button></td>
                  <td className="text-xs text-slate-500">{e.note}</td>
                </tr>
              );
            })}
            {(!w.events || w.events.length===0) && <tr><td colSpan={6}><Empty msg="No wallet events"/></td></tr>}
          </tbody>
        </table>
      </Card>

      {/* ── Trip-wise ledger (filtered) ── */}
      <Card title="Trip-wise Ledger" right={
        <div className="flex items-center gap-2">
          {filter!=='all' && (
            <span className="chip bg-brand-50 text-brand-700">
              Filter: {FILTER_LABELS[filter]} ({visibleTrips.length})
              <button className="ml-1 hover:text-brand-900" onClick={()=>setFilter('all')}>✕</button>
            </span>
          )}
          <Button kind="ghost" size="sm">Download CSV</Button>
        </div>
      }>
        <table className="min-w-full text-sm">
          <thead className="text-slate-500 text-xs">
            <tr className="text-left">
              <th className="py-2"><input type="checkbox"/></th>
              <th>Trip</th><th>Route</th><th>Status</th><th>POD</th>
              <th className="text-right">{kind==='fo'?'Freight (FO)':'Freight (LSP)'}</th>
              <th className="text-right">Charges</th><th className="text-right">Deductions</th>
              <th className="text-right">{kind==='fo'?'Net Payable':'Net Receivable'}</th>
              <th className="text-right">{kind==='fo'?'Paid':'Received'}</th>
              <th className="text-right">Due</th>
            </tr>
          </thead>
          <tbody>
            {visibleTrips.map(t=>{
              const c = classify(t);
              return (
                <tr key={t.id} className="border-t border-slate-100 hover:bg-slate-50/50">
                  <td className="py-2"><input type="checkbox"/></td>
                  <td><button onClick={()=>setRoute({name:'trip', id:t.id})} className="text-brand-700 font-semibold hover:underline">{t.id}</button></td>
                  <td>{t.route}</td>
                  <td><StatusChip status={t.status}/></td>
                  <td><StatusChip status={t.podStatus}/></td>
                  <td className="text-right tabular-nums">{INR(kind==='fo'?t.fo.freight:t.lsp.freight)}</td>
                  <td className="text-right tabular-nums">{INR(kind==='fo'?c.tot.foCharges:c.tot.lspCharges)}</td>
                  <td className="text-right tabular-nums">{INR(kind==='fo'?c.tot.foDed:c.tot.lspDed)}</td>
                  <td className="text-right tabular-nums font-semibold">{INR(c.net)}</td>
                  <td className="text-right tabular-nums">{INR(c.paid)}</td>
                  <td className={cls('text-right tabular-nums', c.due>0?'text-rose-700':'text-emerald-700')}>{INR(c.due)}</td>
                </tr>
              );
            })}
            {visibleTrips.length===0 && <tr><td colSpan={11}><Empty msg={`No trips match "${FILTER_LABELS[filter]}"`}/></td></tr>}
          </tbody>
        </table>
      </Card>
    </div>
  );
}

    emerald: active?'border-emerald-500 bg-emerald-50 ring-2 ring-emerald-200':'border-slate-200 bg-white hover:border-emerald-300',
    rose:    active?'border-rose-500 bg-rose-50 ring-2 ring-rose-200':'border-slate-200 bg-white hover:border-rose-300',
    amber:   active?'border-amber-500 bg-amber-50 ring-2 ring-amber-200':'border-slate-200 bg-white hover:border-amber-300',
    indigo:  active?'border-indigo-500 bg-indigo-50 ring-2 ring-indigo-200':'border-slate-200 bg-white hover:border-indigo-300',
    slate:   active?'border-slate-500 bg-slate-50 ring-2 ring-slate-200':'border-slate-200 bg-white hover:border-slate-300',
  };
  return (
    <button onClick={onClick} className={cls('rounded-2xl border p-4 text-left transition shadow-soft', tones[tone])}>
      <div className="flex items-center justify-between">
        <div className="text-xs text-slate-500 font-medium uppercase tracking-wide">{label}</div>
        {icon && <div className="text-lg">{icon}</div>}
      </div>
      <div className="text-2xl font-semibold text-slate-900 mt-1 tabular-nums">{value}</div>
      <div className="text-[11px] text-slate-500 mt-1">{sub}</div>
      <div className="text-[11px] text-brand-700 mt-2">{active?'✓ Filtering trip list':'Click to filter →'}</div>
    </button>
  );
}

function FTLedgerPage(){
  const { trips, wallets } = useApp();
  let totPay=0,totRecv=0,totPaid=0,totRecvd=0,totMargin=0;
  trips.forEach(t=>{ const x=tripTotals(t); totPay+=x.foNet; totRecv+=x.lspNet; totPaid+=x.foPaid; totRecvd+=x.lspRecvd; totMargin+=x.ftExpMargin; });

  const foExposureOwed = Object.entries(wallets).filter(([k])=>k.startsWith('FO')).reduce((s,[,w])=>s+w.partyOwes,0);
  const lspExposureOwed = Object.entries(wallets).filter(([k])=>k.startsWith('LSP')).reduce((s,[,w])=>s+w.partyOwes,0);

  return (
    <div className="space-y-4">
      <div><h1 className="text-xl font-semibold">Freight Tiger — Tenant Ledger</h1><p className="text-sm text-slate-500">Marketplace-wide payable, receivable and exposure</p></div>
      <div className="grid grid-cols-4 gap-3">
        <SummaryCard label="Gross Payable (FO)" value={INR(totPay)} sub={`Paid ${INR(totPaid)} • Due ${INR(totPay-totPaid)}`} tone="rose"/>
        <SummaryCard label="Gross Receivable (LSP)" value={INR(totRecv)} sub={`Received ${INR(totRecvd)} • Due ${INR(totRecv-totRecvd)}`} tone="emerald"/>
        <SummaryCard label="Expected Margin" value={INR(totMargin)} sub={`Across ${trips.length} trips`} tone="brand"/>
        <SummaryCard label="Recovery Exposure" value={INR(foExposureOwed+lspExposureOwed)} sub={`FO ${INR(foExposureOwed)} • LSP ${INR(lspExposureOwed)}`} tone="slate"/>
      </div>

      <Card title="Trip-wise Settlement">
        <table className="min-w-full text-sm">
          <thead className="text-slate-500 text-xs"><tr className="text-left">
            <th className="py-2">Trip</th><th>Route</th><th>Status</th>
            <th className="text-right">Paid (FO)</th><th className="text-right">Recvd (LSP)</th>
            <th>FO Settled</th><th>LSP Settled</th><th className="text-right">Margin</th>

          <tbody>
            {trips.map(t=>{

                <tr key={t.id} className="border-t border-slate-100">
                  <td className="py-2 font-semibold text-brand-700">{t.id}</td>
                  <td>{t.route}</td>
                  <td><StatusChip status={t.status}/></td>
                  <td className="text-right tabular-nums">{INR(x.foPaid)}</td>
                  <td className="text-right tabular-nums">{INR(x.lspRecvd)}</td>
                  <td><StatusChip status={x.foDue<=0?'SETTLED':'IN-TRANSIT'}/></td>
                  <td><StatusChip status={x.lspDue<=0?'SETTLED':'IN-TRANSIT'}/></td>
                  <td className="text-right tabular-nums font-semibold">{INR(x.ftRealMargin)}</td>

        </table>
      </Card>

function RulesEngineTab(){
  const { rules, setRules, showToast } = useApp();
  function updateSlab(i, field, val){
    const next = { ...rules, commission: rules.commission.map((s,idx)=>idx===i?{...s,[field]:Number(val)}:s) };
    setRules(next);
  }
  function updateTDS(field, val){ setRules({ ...rules, tds: { ...rules.tds, [field]: Number(val) }}); }
  function updatePOD(field, val){ setRules({ ...rules, podPenalty: { ...rules.podPenalty, [field]: Number(val) }}); }
  function toggleGating(id){ setRules({ ...rules, gating: rules.gating.map(g=>g.id===id?{...g,enabled:!g.enabled}:g) }); }

  return (
    <div className="space-y-4">
      <Card title="Commission Slabs (LSP freight → fee)" right={<Button size="sm" kind="soft" onClick={()=>{setRules({...rules,commission:[...rules.commission,{upto:999999,fee:0}]});}}>+ Slab</Button>}>
        <table className="text-sm">
          <thead className="text-slate-500 text-xs"><tr className="text-left"><th className="py-2 pr-6">Freight ≤</th><th>Fee</th></tr></thead>
          <tbody>
            {rules.commission.map((s,i)=>(
              <tr key={i} className="border-t border-slate-100">
                <td className="py-2 pr-6"><Input className="w-40" type="number" value={s.upto} onChange={e=>updateSlab(i,'upto',e.target.value)}/></td>
                <td><Input className="w-32" type="number" value={s.fee} onChange={e=>updateSlab(i,'fee',e.target.value)}/></td>
              </tr>
            ))}
          </tbody>
        </table>
      </Card>

      <Card title="TDS Rules">
        <div className="grid grid-cols-3 gap-4">
          <Input label="If exemption" type="number" value={rules.tds.exemption} onChange={e=>updateTDS('exemption',e.target.value)}/>
          <Input label="If PAN missing" type="number" value={rules.tds.panMissing} onChange={e=>updateTDS('panMissing',e.target.value)}/>
          <Input label="If PAN valid" type="number" value={rules.tds.panValid} onChange={e=>updateTDS('panValid',e.target.value)}/>
        </div>
      </Card>

      <Card title="POD Late Penalty">
        <div className="grid grid-cols-3 gap-4">
          <Input label="Grace days" type="number" value={rules.podPenalty.gracedays} onChange={e=>updatePOD('gracedays',e.target.value)}/>
          <Input label="₹ per day after grace" type="number" value={rules.podPenalty.perDay} onChange={e=>updatePOD('perDay',e.target.value)}/>
          <Input label="Forfeit-all after (days)" type="number" value={rules.podPenalty.fullForfeitAfterDays} onChange={e=>updatePOD('fullForfeitAfterDays',e.target.value)}/>
        </div>
      </Card>

      <Card title="Payment Gating Rules">
        <div className="space-y-2">
          {rules.gating.map(g=>(
            <div key={g.id} className="flex items-center justify-between p-2 rounded-lg hover:bg-slate-50">
              <div className="text-sm text-slate-700">{g.name}</div>
              <Toggle checked={g.enabled} onChange={()=>toggleGating(g.id)}/>
            </div>
          ))}
        </div>
      </Card>
    </div>
  );
}

/* ============================================================

function Page(){
  const { route } = useApp();
  switch (route.name){
    case 'payments': return <PaymentsPage/>;
    case 'trip':     return <TripDetail id={route.id}/>;
    case 'fo':       return <FOListPage/>;
    case 'fo-detail':return <PartyLedger kind="fo" id={route.id}/>;
    case 'lsp':      return <LSPListPage/>;
    case 'lsp-detail':return <PartyLedger kind="lsp" id={route.id}/>;
    case 'ft':       return <FTLedgerPage/>;
    case 'wallet':   return <WalletPage/>;
    case 'documents':return <DocumentsPage/>;
    case 'reports':  return <ReportsPage/>;
    case 'admin':    return <AdminPage/>;
    default:         return <PaymentsPage/>;
  }
}

function App(){
  return (
    <AppProvider>
      <div className="flex h-full">
        <Sidebar/>
        <main className="flex-1 flex flex-col min-w-0">
          <Topbar/>
          <div className="flex-1 overflow-y-auto p-6">
            <Page/>
          </div>
        </main>
      </div>
      <Toast/>
    </AppProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
